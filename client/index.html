<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HR Navigator — Frontend</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <header class="site-header">
    <h1>HR Navigator</h1>
    <p class="tagline">Users & Tickets (Frontend prototype)</p>
  </header>

  <main class="container">
    <section class="auth">
      <h2>Authentication (local prototype)</h2>
      <div class="auth-forms">
        <form id="registerForm" class="form">
          <h3>Register</h3>
          <input required id="regName" placeholder="Full name" />
          <input required id="regEmail" placeholder="Email" type="email" />
          <button type="submit">Register</button>
        </form>

        <form id="loginForm" class="form">
          <h3>Login</h3>
          <input required id="loginEmail" placeholder="Email" type="email" />
          <button type="submit">Login</button>
        </form>
      </div>
    </section>

    <section class="dashboard hidden" id="dashboard">
      <div class="dashboard-header">
        <h2>Dashboard</h2>
        <div>
          <span id="currentUser"></span>
          <button id="logoutBtn">Logout</button>
        </div>
      </div>

      <div class="ticket-area">
        <div class="ticket-form">
          <h3>Create Ticket</h3>
          <form id="ticketForm">
            <input id="ticketTitle" placeholder="Title" required />
            <textarea id="ticketDesc" placeholder="Description" required></textarea>
            <select id="ticketPriority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
            <button type="submit">Create</button>
          </form>
        </div>

        <div class="ticket-list">
          <h3>Tickets</h3>
          <ul id="tickets"></ul>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <small>Prototype frontend — data is local until backend is implemented</small>
  </footer>

  <script src="./js/app.js"></script>
</body>
</html>
